<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter H</title>
<style>
.h{background-color: white;
display: inline-block;
height:40px;
padding:0px;
}
.hl{
    margin: 0px -4px 0px 0px;
    background-color: black;
    display: inline-block;
    width:5px;
    height: 40px;
    padding:0px;
}
.hr{margin: 0px 0px 0px -4px;
    background-color: black;
    display: inline-block;
    width:5px;
    height: 40px;
}
.hm{margin: 0px 0px 17px 0px;
    padding: 0px;
    background-color: black;
    display: inline-block;
    width:20px;
    height: 5px;
}

</style>
</head>
<body>
<div class="h">
    <div class="hl"></div>
    <div class="hm"></div>
    <div class="hr"></div>
</div>

</body>
</html>
