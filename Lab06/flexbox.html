<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .flexparent{
    display:flex;
    align-items:center;
    height:100vh;
    gap:4vw;
    width:100%;
  }

  .flexchild{
    flex:2 1 0;
    min-width:0;
  }

  .child2{
    flex:3 1 0;
  }
</style>

<body>
  <div class="flexparent">
    <img src="https://picsum.photos/200/200?1" class="flexchild">
    <img src="https://picsum.photos/200/200?2" class="flexchild child2">
    <img src="https://picsum.photos/200/200?3" class="flexchild">
  </div>
</body>

</html>
