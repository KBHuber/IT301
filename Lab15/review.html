<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts </title>

  <style>
    body {
      background-color: #f0f2f5;
      font-family: Helvetica, Arial, sans-serif;
    }

    form {
      min-height: 180px;
    }

    article,
    form {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      padding: 12px 16px;
      margin-bottom: 16px;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }

    h2 {
      color: #050505;
      font-size: 0.9375rem;
      font-weight: 600;
      margin: 0 0 4px 0;
    }

    p {
      color: #050505;
      font-size: 0.9375rem;
      line-height: 1.3333;
      margin: 8px 0 0 0;
    }
  </style>
</head>

<body>
  <h1> Welcome to my Posts page! </h1>

  <form action="#">

    <label for="userID">Select User:</label>
    <select id="userID">
      <option value="">--Please choose an option--</option>
      <option value="1">User 1</option>
      <option value="2">User 2</option>
      <option value="3">User 3</option>
      <option value="4">User 4</option>
      <option value="5">User 5</option>
      <option value="6">User 6</option>
      <option value="7">User 7</option>
    </select>

    <button type="button" id="filterBtn">Filter</button>

    <br><br>

    <label for="displayUserID">Enter User ID:</label>
    <input type="number" id="displayUserID" min="1" max="10">

    <button type="button" id="displayUserBtn">Display User Posts</button>

    <br><br>

    <label for="postID">Enter Post ID:</label>
    <input type="number" id="postID" min="1" max="100">

    <button type="button" id="findBtn">Find</button>

  </form>

  <script>

    // Task 1:
    async function fetchPosts() {
      let p = await fetch("https://jsonplaceholder.typicode.com/posts");
      p = await p.json();
      console.table(p);
      return p;
    }

    // Task 2:
    function showPosts(posts) {
      postParent.replaceChildren();
      document.body.appendChild(postParent);
      posts.forEach(postObject => {
        let post = document.createElement('article')
        let postTitle = document.createElement('h2');
        let postBody = document.createElement('p');
        let IDs = document.createElement('p')
        post.appendChild(postTitle);
        post.appendChild(postBody);
        post.appendChild(IDs);
        postParent.appendChild(post);
        postTitle.textContent = postObject.title;
        postBody.textContent = postObject.body;
        IDs.textContent = `UserID: ${postObject.userId} | PostID: ${postObject.id}`;
      })
    };

    // Tasks 3, 4:
    document.getElementById("filterBtn").addEventListener('click', function () {
      userID = document.getElementById('userID').value;
      console.log(posts.filter(post => post.userId == userID));
    });

    // Task 5:
    document.getElementById("displayUserBtn").addEventListener('click', function () {
      let userID = document.getElementById("displayUserID").value;
      // if blank, show all
      if (userID == 0) {
        showPosts(posts);
      }
      else {
        showPosts(posts.filter(post => post.userId == userID));
      }
    });

    // Task 6:
    document.getElementById("findBtn").addEventListener('click', function () {
      let postID = document.getElementById("postID").value;
      post = posts.find(postObject => postObject.id == postID);
      if (!post) {
        alert("No Post Found for that ID.");
      } else {
        showPosts([post]);
      }
    });

    // Main:
    let posts = Array();
    let postParent = document.createElement('div');
    fetchPosts().then((data) => {
      posts = data;
      showPosts(posts);
    });

  </script>

</body>

</html>
