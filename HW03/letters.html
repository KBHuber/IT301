<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letters HIT</title>
<style>
.letter {
    display: inline-block;
    margin: 20px 10px;
}
.px {
    display: inline-block;
    vertical-align: top;
    background-color:black;
    width: 8px;
}
.vertical {
    height: 48px;
}
.mid {
    width: 24px;
    height: 8px;
    margin-top: 20px;
}
.top {
    width: 16px;
    height: 8px;
}
</style>
</head>
<body>
<div class="letter"><div class="px vertical"></div><div class="px mid"></div><div class="px vertical"></div></div>
<div class="letter"><div class="px vertical"></div></div>
<div class="letter"><div class="px top"></div><div class="px vertical"></div><div class="px top"></div></div>
</body>
</html>
