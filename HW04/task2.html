<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .images {
    display: flex;
    justify-content: space-between;
    height: 600px;
  }

  .left,
  .right {
    display: flex;
  }

  [id="01"] {
    align-self: flex-end;
  }

  [id="02"] {
    align-self: center;
  }

  [id="03"] {
    align-self: flex-start;
  }

  [id="04"] {
    align-self: flex-start;
  }

  [id="05"] {
    align-self: center;
  }

  [id="06"] {
    align-self: flex-end;
  }
</style>

<body>
  <div class="images">
    <div class="left">
      <img id="01" alt="random" src="https://picsum.photos/200/200?1">
      <img id="02" alt="random" src="https://picsum.photos/200/200?2">
      <img id="03" alt="random" src="https://picsum.photos/200/200?3">
    </div>
    <div class="right">
      <img id="04" alt="random" src="https://picsum.photos/200/200?4">
      <img id="05" alt="random" src="https://picsum.photos/200/200?5">
      <img id="06" alt="random" src="https://picsum.photos/200/200?6">
    </div>
  </div>
</body>

</html>
